name: Debug Phase 40 formatting

on:
  push:
    branches:
      - phase-40-premium-email-activation-gate

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Show exact Prettier diff
        run: |
          npx prettier --write scripts/lib/email-notifications-activation.mjs
          git diff -- scripts/lib/email-notifications-activation.mjs
          git diff --exit-code -- scripts/lib/email-notifications-activation.mjs
