name: Debug Phase 40B formatting

on:
  push:
    branches:
      - phase-40b-email-worker-activation-test

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Show exact Prettier diff
        run: |
          npx prettier --write docs/EMAIL_NOTIFICATIONS_OPERATIONS.md scripts/lib/email-notifications-activation.mjs worker/email-notifications/src/index.js worker/email-notifications/test/index.test.js
          git diff -- docs/EMAIL_NOTIFICATIONS_OPERATIONS.md scripts/lib/email-notifications-activation.mjs worker/email-notifications/src/index.js worker/email-notifications/test/index.test.js
          git diff --exit-code -- docs/EMAIL_NOTIFICATIONS_OPERATIONS.md scripts/lib/email-notifications-activation.mjs worker/email-notifications/src/index.js worker/email-notifications/test/index.test.js
