name: Debug Phase 41 formatting

on:
  push:
    branches:
      - phase-41-money-personalization-profile

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Show exact Prettier diff
        run: |
          npx prettier --write docs/DATA_MAP.md docs/MONEY_PHASE_41.md src/components/MoneySettingsCard.jsx src/domain/money.test.js src/domain/moneyAssistant.test.js src/domain/moneyPersonalization.js
          git diff -- docs/DATA_MAP.md docs/MONEY_PHASE_41.md src/components/MoneySettingsCard.jsx src/domain/money.test.js src/domain/moneyAssistant.test.js src/domain/moneyPersonalization.js
          git diff --exit-code -- docs/DATA_MAP.md docs/MONEY_PHASE_41.md src/components/MoneySettingsCard.jsx src/domain/money.test.js src/domain/moneyAssistant.test.js src/domain/moneyPersonalization.js
