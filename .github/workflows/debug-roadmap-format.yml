name: Debug roadmap formatting

on:
  push:
    branches:
      - phase-37-roadmap-homologation-closure

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Show exact Prettier diff
        run: |
          npx prettier --write ROADMAP.md
          git diff -- ROADMAP.md
          git diff --exit-code -- ROADMAP.md
