name: Update Worker tooling security

on:
  push:
    branches:
      - phase-40c-worker-tooling-security

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: phase-40c-worker-tooling-security

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update Worker package and lockfile
        working-directory: worker/email-notifications
        shell: bash
        run: |
          npm pkg set "engines.node=>=20.3.0"
          npm pkg set "scripts.audit:high=npm audit --audit-level=high"
          npm pkg set "scripts.validate=npm run check && npm run test && npm run audit:high"
          npm install --save-dev --save-exact wrangler@4.143.0
          node -p "'WRANGLER_VERSION ' + require('./node_modules/wrangler/package.json').version"
          npm audit --audit-level=high

      - name: Commit updated Worker tooling
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/email-notifications/package.json worker/email-notifications/package-lock.json
          if git diff --cached --quiet; then
            echo "No package changes to commit."
            exit 0
          fi
          git commit -m "Phase 40C: update Worker tooling security"
          git push origin HEAD:phase-40c-worker-tooling-security
