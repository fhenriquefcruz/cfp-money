name: Debug Worker tooling audit

on:
  push:
    branches:
      - phase-40c-worker-tooling-security

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Audit current locked Worker tooling
        working-directory: worker/email-notifications
        shell: bash
        run: |
          npm ci
          node -p "'CURRENT_VERSION ' + require('./node_modules/wrangler/package.json').version"
          npm audit --json > current-audit.json || true
          node - <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('current-audit.json', 'utf8'))
          console.log('CURRENT', JSON.stringify(report.metadata?.vulnerabilities || {}))
          NODE

      - name: Audit Wrangler 4.142.0 in clean temporary project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler-audit"
          cd "$RUNNER_TEMP/wrangler-audit"
          npm init -y >/dev/null
          npm install --save-dev wrangler@4.142.0
          node -p "'LATEST_VERSION ' + require('./node_modules/wrangler/package.json').version"
          npm audit --json > latest-audit.json || true
          node - <<'NODE'
          const fs = require('fs')
          const report = JSON.parse(fs.readFileSync('latest-audit.json', 'utf8'))
          console.log('LATEST', JSON.stringify(report.metadata?.vulnerabilities || {}))
          for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
            console.log('LATEST_ITEM', JSON.stringify({
              name,
              severity: item.severity,
              isDirect: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
            }))
          }
          NODE
