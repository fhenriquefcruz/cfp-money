name: Temporary Firebase rules release formatting
on:
  push:
    branches: [feat/phase-57-secure-firestore-rules]
    paths: [.github/workflows/format-rule-release.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/verify-firestore-rules-release.mjs
      - name: Commit reviewed script formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-firestore-rules-release.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize guarded rules release verifier"
            git push
          fi
