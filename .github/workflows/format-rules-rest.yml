name: Temporary REST publisher formatter
on:
  push:
    branches: [fix/firestore-rules-rest-publisher]
    paths: [.github/workflows/format-rules-rest.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/publish-firestore-rules-rest.mjs
      - name: Commit reviewed formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish-firestore-rules-rest.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize scoped Rules API publisher"
            git push
          fi
