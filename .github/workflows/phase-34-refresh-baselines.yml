name: Phase 34 visual baseline refresh

on:
  push:
    branches:
      - phase-34-homologation-ux-clean

permissions:
  contents: write

jobs:
  refresh-baselines:
    if: ${{ !contains(github.event.head_commit.message, '[baseline-update]') && !contains(github.event.head_commit.message, '[remove-baseline-workflow]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_E2E_MODE: 'true'
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: '1:123456789:web:test'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-34-homologation-ux-clean

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Refresh visual snapshots
        run: npm run test:visual:update

      - name: Commit approved baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            e2e/visual/visual.spec.js-snapshots/reports-visual-desktop-chromium-linux.png \
            e2e/visual/visual.spec.js-snapshots/reports-visual-mobile-chromium-linux.png \
            e2e/visual/visual.spec.js-snapshots/transactions-visual-mobile-chromium-linux.png
          if git diff --cached --quiet; then
            echo "No approved baseline changes to commit."
            exit 0
          fi
          git commit -m "test: update Phase 34 visual baselines [baseline-update]"
          git push origin HEAD:phase-34-homologation-ux-clean
