name: Phase 41B format personalization

on:
  push:
    branches:
      - phase-41b-money-personalization-revival
    paths:
      - .github/workflows/phase-41b-format-personalization.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-41b-money-personalization-revival
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/domain/moneyAssistant.js src/domain/moneyAssistant.test.js src/domain/moneyPersonalization.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/moneyAssistant.js src/domain/moneyAssistant.test.js src/domain/moneyPersonalization.js
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Phase 41B: format personalization files"
            git push origin HEAD:phase-41b-money-personalization-revival
          fi
