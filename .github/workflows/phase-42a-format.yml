name: Phase 42A format

on:
  push:
    branches:
      - phase-42a-financial-semantics

permissions:
  contents: write

jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-42a-financial-semantics
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format Phase 42A files
        run: |
          npx prettier --write             docs/FINANCIAL_SEMANTICS.md             src/components/FinancialHealthScore.test.jsx             src/components/TransactionForm.jsx             src/components/TransactionForm.test.jsx             src/components/TransactionList.jsx             src/domain/categoryReview.js             src/domain/finance.test.js             src/domain/financialHealth.test.js             src/domain/money.test.js             src/domain/moneyPresentation.test.js             src/domain/monthlyFinance.js             src/domain/monthlyFinance.test.js             src/domain/paymentControl.js             src/domain/transactionDates.js             src/utils/index.test.jsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/FINANCIAL_SEMANTICS.md             src/components/FinancialHealthScore.test.jsx             src/components/TransactionForm.jsx             src/components/TransactionForm.test.jsx             src/components/TransactionList.jsx             src/domain/categoryReview.js             src/domain/finance.test.js             src/domain/financialHealth.test.js             src/domain/money.test.js             src/domain/moneyPresentation.test.js             src/domain/monthlyFinance.js             src/domain/monthlyFinance.test.js             src/domain/paymentControl.js             src/domain/transactionDates.js             src/utils/index.test.jsx
          git commit -m "Phase 42A: apply project formatting"
          git push origin HEAD:phase-42a-financial-semantics
