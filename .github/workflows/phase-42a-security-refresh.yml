name: Phase 42A security refresh

on:
  push:
    branches:
      - phase-42a-financial-semantics

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-42a-financial-semantics
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pin patched gRPC dependency
        run: |
          npm pkg set 'overrides.@grpc/grpc-js=1.14.5'
          npm install --package-lock-only
          npm audit --omit=dev --audit-level=high
      - name: Commit dependency refresh
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "No dependency changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Security: pin patched grpc-js dependency"
          git push origin HEAD:phase-42a-financial-semantics
