name: Phase 42B dashboard baselines

on:
  push:
    branches:
      - phase-42b-dashboard-decision-flow

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-42b-dashboard-decision-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Update Dashboard snapshots only
        env:
          VITE_E2E_MODE: 'true'
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: test-project
          VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
          VITE_FIREBASE_APP_ID: '1:123456789:web:test'
        run: |
          npx playwright test             --config=playwright.visual.config.js             --grep "dashboard mantém baseline visual"             --update-snapshots
      - name: Commit Dashboard baselines
        run: |
          if git diff --quiet e2e/visual/visual.spec.js-snapshots/dashboard-visual-desktop-chromium-linux.png e2e/visual/visual.spec.js-snapshots/dashboard-visual-mobile-chromium-linux.png; then
            echo "No baseline changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             e2e/visual/visual.spec.js-snapshots/dashboard-visual-desktop-chromium-linux.png             e2e/visual/visual.spec.js-snapshots/dashboard-visual-mobile-chromium-linux.png
          git commit -m "Phase 42B: update dashboard visual baselines"
          git push origin HEAD:phase-42b-dashboard-decision-flow
