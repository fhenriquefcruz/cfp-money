name: Phase 42D finalize budgets

on:
  push:
    branches:
      - phase-42d-actionable-budgets
    paths:
      - .github/workflows/phase-42d-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    name: Format and update budget baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_E2E_MODE: 'true'
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: '1:123456789:web:test'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: phase-42d-actionable-budgets

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 42D files
        run: |
          npx prettier --write \
            src/components/Budgets.jsx \
            src/components/Budgets.test.jsx \
            src/domain/budgetPeriods.js \
            src/domain/budgetPeriods.test.js \
            scripts/check-performance-budget.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Update Budgets visual baselines
        run: npx playwright test --config=playwright.visual.config.js -g "budgets mantém baseline visual" --update-snapshots

      - name: Commit finalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/Budgets.jsx \
            src/components/Budgets.test.jsx \
            src/domain/budgetPeriods.js \
            src/domain/budgetPeriods.test.js \
            scripts/check-performance-budget.mjs \
            e2e/visual/visual.spec.js-snapshots/budgets-visual-desktop-chromium-linux.png \
            e2e/visual/visual.spec.js-snapshots/budgets-visual-mobile-chromium-linux.png
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Phase 42D: format and update budget baselines"
            git push origin HEAD:phase-42d-actionable-budgets
          fi
