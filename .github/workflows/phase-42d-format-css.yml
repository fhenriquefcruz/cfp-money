name: Phase 42D format CSS

on:
  push:
    branches:
      - phase-42d-actionable-budgets
    paths:
      - .github/workflows/phase-42d-format-css.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-42d-actionable-budgets
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/index.css
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Phase 42D: format budget styles"
            git push origin HEAD:phase-42d-actionable-budgets
          fi
