name: Phase 43 refresh Firebase CLI

on:
  push:
    branches:
      - phase-43-dashboard-composition
    paths:
      - .github/workflows/phase-43-refresh-firebase-tools.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-43-dashboard-composition
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Reproduce with latest Firebase CLI and patched basic-ftp
        run: |
          npm install --save-dev --save-exact firebase-tools@15.32.0
          npm pkg set overrides.basic-ftp=5.3.1
          npm install
      - name: Print audit chain
        run: |
          npm audit --json > audit.json || true
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          const audit = JSON.parse(readFileSync('audit.json', 'utf8'))
          for (const name of ['basic-ftp', 'get-uri', 'pac-proxy-agent', 'proxy-agent', 'firebase-tools']) {
            console.log(name, JSON.stringify(audit.vulnerabilities?.[name] ?? null, null, 2))
          }
          NODE
