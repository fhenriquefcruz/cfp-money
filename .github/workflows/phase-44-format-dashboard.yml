name: Phase 44 format dashboard design

on:
  push:
    branches:
      - phase-44-dashboard-product-design
    paths:
      - .github/workflows/phase-44-format-dashboard.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-44-dashboard-product-design
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/Dashboard.jsx src/index.css scripts/check-performance-budget.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx src/index.css scripts/check-performance-budget.mjs
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Phase 44: format dashboard product design"
            git push origin HEAD:phase-44-dashboard-product-design
          fi
