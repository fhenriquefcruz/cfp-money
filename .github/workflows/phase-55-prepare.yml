name: Temporary Phase 55 preparation
on:
  push:
    branches:
      - feat/phase-55-actionable-dashboard-card-commitments
    paths:
      - .github/workflows/phase-55-prepare.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_E2E_MODE: 'true'
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: '1:123456789:web:test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Synchronize patched Vite lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Format changed source
        run: >
          npx prettier --write
          src/components/Dashboard.jsx
          src/components/CreditCardsDashboard.jsx
          src/components/CreditCardsSettingsCard.jsx
          src/domain/dashboard.js
          src/domain/dashboard.test.js
          src/domain/creditCards.js
          src/domain/creditCards.test.js
          src/domain/creditCardCenter.js
          src/domain/creditCardCenter.test.js
          scripts/check-performance-budget.mjs
          package.json
      - name: Install browser for visual approval
        run: npx playwright install --with-deps chromium
      - name: Refresh intended Dashboard and Cards baselines
        run: npm run test:visual:update
      - name: Check formatting
        run: npm run format:check
      - name: Commit review artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/components/Dashboard.jsx src/components/CreditCardsDashboard.jsx src/components/CreditCardsSettingsCard.jsx src/domain/dashboard.js src/domain/dashboard.test.js src/domain/creditCards.js src/domain/creditCards.test.js src/domain/creditCardCenter.js src/domain/creditCardCenter.test.js scripts/check-performance-budget.mjs e2e/visual/visual.spec.js-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock patched Vite and align phase 55 visual baselines"
            git push
          fi
