name: Temporary Phase 56 formatting
on:
  push:
    branches: [feat/phase-56-category-color-intelligence]
    paths: [.github/workflows/phase-56-format-final.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/domain/categoryComposition.test.js
      - name: Commit review fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/categoryComposition.test.js
          if ! git diff --cached --quiet; then
            git commit -m "style: format category composition regression tests"
            git push
          fi
