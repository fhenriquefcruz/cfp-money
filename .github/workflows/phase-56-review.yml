name: Temporary Phase 56 visual and style normalization
on:
  push:
    branches: [feat/phase-56-category-color-intelligence]
    paths: [.github/workflows/phase-56-review.yml]
permissions:
  contents: write

jobs:
  design-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_E2E_MODE: 'true'
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: '1:123456789:web:test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format only changed sources
        run: >
          npx prettier --write
          docs/CATEGORY_COLOR_SYSTEM.md
          src/domain/categoryComposition.js
          src/domain/categoryComposition.test.js
          src/components/CategoryCompositionVisual.jsx
          src/components/CategoryCompositionVisual.test.jsx
          src/components/Dashboard.jsx
          src/components/TransactionList.jsx
          src/components/Categories.jsx
          src/index.css
      - name: Install browser for deterministic design baselines
        run: npx playwright install --with-deps chromium
      - name: Review intended category-driven screenshot changes
        run: npm run test:visual:update
      - name: Validate formatting without generated reports
        run: |
          rm -rf playwright-visual-report test-results
          npm run format:check
      - name: Commit normalized code and visual baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CATEGORY_COLOR_SYSTEM.md src/domain/categoryComposition.js src/domain/categoryComposition.test.js src/components/CategoryCompositionVisual.jsx src/components/CategoryCompositionVisual.test.jsx src/components/Dashboard.jsx src/components/TransactionList.jsx src/components/Categories.jsx src/index.css e2e/visual/visual.spec.js-snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "style: review category-color snapshots and normalize components"
            git push
          fi
