name: One-time API rules formatter
on:
  push:
    branches: [fix/phase-57-firestore-rules-api-deploy]
    paths: [.github/workflows/phase-57-rules-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write scripts/publish-firestore-rules-api.mjs scripts/verify-firestore-rules-release.mjs
      - name: Commit normalized scripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/publish-firestore-rules-api.mjs scripts/verify-firestore-rules-release.mjs
          if ! git diff --cached --quiet; then
            git commit -m "style: normalize Firebase Rules API release scripts"
            git push
          fi
