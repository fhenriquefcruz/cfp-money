name: Phase 2 exact formatting

on:
  push:
    branches:
      - feat/meu-real-design-phase-2

permissions:
  contents: write

concurrency:
  group: phase2-format
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'autoformat phase2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/meu-real-design-phase-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format changed design files
        run: npx prettier --write src/components/Login.jsx src/index.css src/styles/aurora.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Login.jsx src/index.css src/styles/aurora.css
          git commit -m "chore: autoformat phase2"
          git pull --rebase origin feat/meu-real-design-phase-2
          git push origin HEAD:feat/meu-real-design-phase-2
