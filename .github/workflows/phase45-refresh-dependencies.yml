name: Phase 45 safe dependency security refresh

on:
  push:
    branches:
      - phase-45-goals-savings-reserves
    paths:
      - .github/workflows/phase45-refresh-dependencies.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-45-goals-savings-reserves

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh root lockfile with non-breaking audit fixes
        shell: bash
        run: npm audit fix --package-lock-only || true

      - name: Update Worker Wrangler to audited fixed line
        working-directory: worker/email-notifications
        run: npm install --save-dev --save-exact wrangler@4.149.0 --package-lock-only

      - name: Verify clean installs
        shell: bash
        run: |
          npm ci
          npm ci --prefix worker/email-notifications

      - name: Run application and Worker tests
        shell: bash
        run: |
          npm test
          npm run test --prefix worker/email-notifications

      - name: Commit dependency refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json worker/email-notifications/package.json worker/email-notifications/package-lock.json
          if git diff --cached --quiet; then
            echo "Nenhuma atualização segura disponível."
            exit 0
          fi
          git commit -m "Security: refresh audited development dependencies [dependency-refresh]"
          git push origin HEAD:phase-45-goals-savings-reserves
