name: Phase 46 refresh reviewed visual baselines

on:
  push:
    branches:
      - phase-46-savings-reserves-hub
    paths:
      - .github/workflows/phase46-refresh-visual-baselines.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      VITE_E2E_MODE: 'true'
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: 1:123456789:web:test

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-46-savings-reserves-hub

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual baselines
        run: npm run test:visual:update

      - name: Commit only reviewed Phase 46 baselines
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             e2e/visual/visual.spec.js-snapshots/savings-visual-desktop-chromium-linux.png             e2e/visual/visual.spec.js-snapshots/savings-visual-mobile-chromium-linux.png             e2e/visual/visual.spec.js-snapshots/goals-visual-desktop-chromium-linux.png             e2e/visual/visual.spec.js-snapshots/budgets-visual-desktop-chromium-linux.png             e2e/visual/visual.spec.js-snapshots/reports-visual-desktop-chromium-linux.png             e2e/visual/visual.spec.js-snapshots/profile-visual-desktop-chromium-linux.png
          if git diff --cached --quiet; then
            echo "Nenhum baseline alterado."
            exit 0
          fi
          git commit -m "Phase 46: refresh reviewed visual baselines [visual-baseline]"
          git push origin HEAD:phase-46-savings-reserves-hub
