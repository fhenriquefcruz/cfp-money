name: Phase 48 format touched files

on:
  push:
    branches:
      - phase-48-transaction-navigation-goals-budgets-reports
    paths:
      - .github/workflows/phase48-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-48-transaction-navigation-goals-budgets-reports

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format Phase 48 files
        run: |
          npx prettier --write             docs/FINANCIAL_SEMANTICS.md             docs/PERFORMANCE_BUDGET_PHASE_20.md             e2e/mobile-layout.spec.js             ROADMAP.md             src/components/Savings.jsx             src/components/TransactionList.jsx             src/domain/budgetPeriods.js

      - name: Verify formatting
        run: npm run format:check

      - name: Commit formatting only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/FINANCIAL_SEMANTICS.md             docs/PERFORMANCE_BUDGET_PHASE_20.md             e2e/mobile-layout.spec.js             ROADMAP.md             src/components/Savings.jsx             src/components/TransactionList.jsx             src/domain/budgetPeriods.js
          if git diff --cached --quiet; then
            echo "Nenhuma alteração de formato necessária."
            exit 0
          fi
          git commit -m "Phase 48: format touched files [prettier]"
          git push origin HEAD:phase-48-transaction-navigation-goals-budgets-reports
