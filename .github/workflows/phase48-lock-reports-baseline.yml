name: Phase 48 lock stable reports baseline

on:
  push:
    branches:
      - phase-48-transaction-navigation-goals-budgets-reports
    paths:
      - .github/workflows/phase48-lock-reports-baseline.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      VITE_E2E_MODE: 'true'
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: 1:123456789:web:test

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: phase-48-transaction-navigation-goals-budgets-reports

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate visual baselines
        run: npm run test:visual:update

      - name: Commit stable reports desktop baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/visual.spec.js-snapshots/reports-visual-desktop-chromium-linux.png
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "ERRO: baseline desktop de Relatórios não mudou após alteração geométrica."
            exit 1
          fi
          git commit -m "Phase 48: lock stable reports desktop baseline"
          git push origin HEAD:phase-48-transaction-navigation-goals-budgets-reports
