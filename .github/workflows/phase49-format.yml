name: Phase 49 formatter

on:
  push:
    branches:
      - phase-49-patrimonial-intelligence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-49-patrimonial-intelligence

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format Phase 49 files
        run: npx prettier --write src/components/Savings.jsx src/domain/savingsInsights.js

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Savings.jsx src/domain/savingsInsights.js
          git commit -m "Phase 49: format patrimonial savings files"
          git push origin HEAD:phase-49-patrimonial-intelligence
