name: Phase 49 savings baseline

on:
  push:
    branches:
      - phase-49-patrimonial-intelligence

permissions:
  contents: write

jobs:
  update-savings-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-49-patrimonial-intelligence

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Update only Savings visual baselines
        run: npx playwright test --config=playwright.visual.config.js --update-snapshots --grep "savings mantém baseline visual"

      - name: Commit Savings baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/visual.spec.js-snapshots/savings-visual-desktop-chromium-linux.png
          git add e2e/visual/visual.spec.js-snapshots/savings-visual-mobile-chromium-linux.png
          if git diff --cached --quiet; then
            exit 1
          fi
          git commit -m "Phase 49: update Savings visual baselines"
          git push origin HEAD:phase-49-patrimonial-intelligence
