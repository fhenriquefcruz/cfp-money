name: Phase 50 formatter

on:
  push:
    branches:
      - phase-50-dashboard-executive-refinement

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-50-dashboard-executive-refinement

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format Phase 50 files
        run: npx prettier --write src/components/Dashboard.jsx src/domain/dashboard.js src/domain/dashboard.test.js src/index.css

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx src/domain/dashboard.js src/domain/dashboard.test.js src/index.css
          git commit -m "Phase 50: format dashboard refinement"
          git push origin HEAD:phase-50-dashboard-executive-refinement
