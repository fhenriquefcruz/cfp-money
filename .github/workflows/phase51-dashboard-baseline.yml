name: Phase 51 dashboard baseline

on:
  push:
    branches:
      - phase-51-dashboard-operational-composition

permissions:
  contents: write

jobs:
  update-dashboard-baseline:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-51-dashboard-operational-composition
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write ROADMAP.md
      - run: npx playwright install --with-deps chromium
      - name: Update only desktop Dashboard visual baseline
        run: npx playwright test --config=playwright.visual.config.js --project=visual-desktop-chromium --update-snapshots --grep "dashboard mantém baseline visual"
      - name: Commit Phase 51 baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git add e2e/visual/visual.spec.js-snapshots/dashboard-visual-desktop-chromium-linux.png
          if git diff --cached --quiet; then
            exit 1
          fi
          git commit -m "Phase 51: update Dashboard desktop baseline"
          git push origin HEAD:phase-51-dashboard-operational-composition
