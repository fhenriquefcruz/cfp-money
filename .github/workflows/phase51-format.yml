name: Phase 51 formatter

on:
  push:
    branches:
      - phase-51-dashboard-operational-composition

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-51-dashboard-operational-composition

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format Phase 51 files
        run: npx prettier --write src/components/Dashboard.jsx ROADMAP.md

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx ROADMAP.md
          git commit -m "Phase 51: format dashboard composition"
          git push origin HEAD:phase-51-dashboard-operational-composition
