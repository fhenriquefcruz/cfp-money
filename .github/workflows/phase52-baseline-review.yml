name: Phase 52 baseline review

on:
  push:
    branches:
      - phase-52-dashboard-premium-data-viz

permissions:
  contents: read

jobs:
  generate-dashboard-baselines:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-52-dashboard-premium-data-viz
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate Dashboard baselines for review
        run: npx playwright test --config=playwright.visual.config.js --update-snapshots --grep "dashboard mantém baseline visual"
      - name: Package Dashboard baselines
        run: |
          mkdir -p phase52-dashboard-baselines
          cp e2e/visual/visual.spec.js-snapshots/dashboard-visual-desktop-chromium-linux.png phase52-dashboard-baselines/
          cp e2e/visual/visual.spec.js-snapshots/dashboard-visual-mobile-chromium-linux.png phase52-dashboard-baselines/
          cp e2e/visual/visual.spec.js-snapshots/dashboard-charts-visual-desktop-chromium-linux.png phase52-dashboard-baselines/
          cp e2e/visual/visual.spec.js-snapshots/dashboard-charts-visual-mobile-chromium-linux.png phase52-dashboard-baselines/
      - uses: actions/upload-artifact@v7
        with:
          name: phase52-dashboard-baselines
          path: phase52-dashboard-baselines
          if-no-files-found: error
