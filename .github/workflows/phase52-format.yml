name: Phase 52 formatter

on:
  push:
    branches:
      - phase-52-premium-dashboard-dataviz

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-52-premium-dashboard-dataviz
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/Dashboard.jsx src/styles/global.css ROADMAP.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx src/styles/global.css ROADMAP.md
          git commit -m "Phase 52: format premium dashboard dataviz"
          git push origin HEAD:phase-52-premium-dashboard-dataviz
