name: Phase 52 roadmap formatter

on:
  push:
    branches:
      - phase-52-dashboard-premium-data-viz

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-52-dashboard-premium-data-viz
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write ROADMAP.md
      - name: Commit roadmap formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "Format roadmap after dashboard phases"
          git push origin HEAD:phase-52-dashboard-premium-data-viz
