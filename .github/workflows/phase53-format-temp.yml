name: Temporary Phase 53 formatting
on:
  push:
    branches: [phase-53-card-transaction-date-integrity]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase-53-card-transaction-date-integrity
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/CreditCardsDashboard.jsx src/components/InvoiceLifecycleModal.jsx src/components/Reports.jsx src/components/TransactionForm.jsx src/components/TransactionList.jsx src/domain/creditCardCenter.test.js src/components/ui.jsx src/domain/creditCardCenter.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/CreditCardsDashboard.jsx src/components/InvoiceLifecycleModal.jsx src/components/Reports.jsx src/components/TransactionForm.jsx src/components/TransactionList.jsx src/domain/creditCardCenter.test.js src/components/ui.jsx src/domain/creditCardCenter.js
          git commit -m "Phase 53: format card linkage and date pickers"
          git push origin HEAD:phase-53-card-transaction-date-integrity
