name: Phase 53 formatter

on:
  push:
    branches:
      - phase-53-card-transaction-integration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-53-card-transaction-integration
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/domain/invoiceLifecycle.js src/domain/invoiceLifecycle.test.js src/domain/creditCardCenter.js src/domain/creditCardCenter.test.js src/components/TransactionForm.jsx src/components/TransactionForm.test.jsx e2e/cards-transactions-integration.spec.js
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/invoiceLifecycle.js src/domain/invoiceLifecycle.test.js src/domain/creditCardCenter.js src/domain/creditCardCenter.test.js src/components/TransactionForm.jsx src/components/TransactionForm.test.jsx e2e/cards-transactions-integration.spec.js
          git commit -m "Phase 53: format cards transaction integration"
          git push origin HEAD:phase-53-card-transaction-integration
