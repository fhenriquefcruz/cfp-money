name: Phase 53 formatter
on:
  push:
    branches: [phase-53-card-reconciliation-date-pickers]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-53-card-reconciliation-date-pickers
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/ui.jsx src/components/ui.test.jsx src/components/CreditCardsDashboard.jsx src/components/TransactionForm.jsx src/components/TransactionForm.test.jsx src/components/TransactionList.jsx src/components/InvoiceLifecycleModal.jsx src/components/Reports.jsx src/domain/creditCardCenter.js src/domain/creditCardCenter.test.js
      - name: Save formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components src/domain/creditCardCenter.js src/domain/creditCardCenter.test.js
          git commit -m "Phase 53: format card reconciliation and calendar inputs"
          git push origin HEAD:phase-53-card-reconciliation-date-pickers
