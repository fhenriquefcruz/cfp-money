name: Phase 53 formatter

on:
  push:
    branches:
      - phase-53-dashboard-actionable-intelligence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-53-dashboard-actionable-intelligence
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/Dashboard.jsx src/domain/dashboard.js src/domain/dashboard.test.js ROADMAP.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Dashboard.jsx src/domain/dashboard.js src/domain/dashboard.test.js ROADMAP.md
          git commit -m "Phase 53: format actionable dashboard intelligence"
          git push origin HEAD:phase-53-dashboard-actionable-intelligence
