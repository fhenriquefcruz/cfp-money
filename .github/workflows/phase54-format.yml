name: Phase 54 formatter

on:
  push:
    branches:
      - phase-54-card-intelligence

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: phase-54-card-intelligence
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/domain/creditCards.js src/domain/creditCards.test.js src/domain/creditCardCenter.js src/domain/creditCardCenter.test.js src/components/CreditCardsDashboard.jsx src/components/CreditCardsSettingsCard.jsx ROADMAP.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/creditCards.js src/domain/creditCards.test.js src/domain/creditCardCenter.js src/domain/creditCardCenter.test.js src/components/CreditCardsDashboard.jsx src/components/CreditCardsSettingsCard.jsx ROADMAP.md
          git commit -m "Phase 54: format card intelligence"
          git push origin HEAD:phase-54-card-intelligence
