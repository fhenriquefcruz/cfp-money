name: PR 214 visual candidates (temporary)
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pr214-visual-candidates.yml'
      - 'src/**'
      - 'e2e/visual/**'
permissions:
  contents: read
concurrency:
  group: pr214-candidates-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  candidates:
    if: github.event.pull_request.number == 214 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VITE_E2E_MODE: 'true'
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: '1:123456789:web:test'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate candidate snapshots
        run: npm run test:visual:update
      - name: Verify generated candidates
        run: npm run test:visual
      - name: Upload candidate snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr214-linux-candidates
          path: |
            e2e/visual/visual.spec.js-snapshots/*.png
            playwright-visual-report
            test-results
          if-no-files-found: error
          retention-days: 7
