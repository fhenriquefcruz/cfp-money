name: Security audit diagnostic

on:
  push:
    branches:
      - security-dev-only-braces-advisory
    paths:
      - .github/workflows/security-audit-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print audit chain
        run: |
          npm audit --json > audit.json || true
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs'
          const audit = JSON.parse(readFileSync('audit.json', 'utf8'))
          for (const name of ['braces','micromatch','chokidar','fast-glob','globby','gh-pages','tailwindcss','firebase-tools']) {
            console.log('\n###', name)
            console.log(JSON.stringify(audit.vulnerabilities?.[name] ?? null, null, 2))
          }
          NODE
