name: Temporary Functions security lockfile repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/oct-2026-advisory-patches'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate verified Functions dependency graph
        run: npm install --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Validate deterministic clean install
        run: npm ci --prefix functions --ignore-scripts --no-fund
      - name: Audit Functions dependencies
        run: npm audit --prefix functions --omit=dev --audit-level=high
      - name: Verify fixed versions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const lock = JSON.parse(fs.readFileSync('functions/package-lock.json', 'utf8'))
          for (const [path, expected] of Object.entries({
            'node_modules/@grpc/grpc-js': '1.14.5',
            'node_modules/body-parser': '1.20.9',
          })) {
            const item = lock.packages[path]
            if (!item || item.version !== expected || !item.integrity)
              throw new Error(`Expected ${path}@${expected}, found ${item?.version}`)
            console.info('Patched:', path, item.version)
          }
          JS
      - name: Commit only verified Functions lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add functions/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): lock corrected Functions grpc-js dependencies'
            git push origin HEAD:refs/heads/security/oct-2026-advisory-patches
          fi
