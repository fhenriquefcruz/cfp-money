name: Security advisory lockfile regeneration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/oct-2026-advisory-patches'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate dependency lockfile from npm registry
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify package versions and integrity
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          const versions = {
            'node_modules/undici': '6.29.1',
            'node_modules/zod': '4.6.7',
            'node_modules/body-parser': '1.20.9',
            'node_modules/@modelcontextprotocol/sdk/node_modules/body-parser': '2.4.0',
          }
          for (const [key, version] of Object.entries(versions)) {
            const value = lock.packages[key]
            if (!value || value.version !== version || !value.integrity) {
              throw new Error(`Lockfile inválido: ${key} => ${value?.version}`)
            }
            console.info('Verified', key, version)
          }
          JS
      - name: Commit only updated npm lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): regenerate verified advisory-patched lockfile'
            git push origin HEAD:refs/heads/security/oct-2026-advisory-patches
          fi
