name: One-time security lockfile validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/oct-2026-advisory-patches'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve and install patched graph without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test exact lockfile under clean installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify patched versions
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          for (const [key, version] of Object.entries({
            'node_modules/undici': '6.29.1',
            'node_modules/zod': '4.6.7',
            'node_modules/body-parser': '1.20.9',
            'node_modules/@modelcontextprotocol/sdk/node_modules/body-parser': '2.4.0',
          })) {
            const entry = lock.packages[key]
            if (!entry || entry.version !== version || !entry.integrity)
              throw new Error(`Insecure lockfile: ${key} ${entry?.version}`)
            console.info(key, version)
          }
          JS
      - name: Commit verified lockfile only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): reconcile audited npm install tree'
            git push origin HEAD:refs/heads/security/oct-2026-advisory-patches
          fi
