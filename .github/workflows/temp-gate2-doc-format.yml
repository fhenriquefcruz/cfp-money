name: Temporary Gate 2 documentation format diff

on:
  push:
    branches:
      - fix/gate-2-2-reversal-concurrency

permissions:
  contents: read

jobs:
  prettier-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show exact formatting patch
        shell: bash
        run: |
          npx --no-install prettier docs/GATE_2_RELEASE_COMPATIBILITY.md > /tmp/gate2.md
          diff -u docs/GATE_2_RELEASE_COMPATIBILITY.md /tmp/gate2.md || true
