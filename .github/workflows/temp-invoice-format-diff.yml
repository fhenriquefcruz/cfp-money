name: Temporary invoice formatting diagnostic

on:
  push:
    branches:
      - fix/gate-2-2-reversal-concurrency

permissions:
  contents: read

jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show precise Prettier formatting difference
        shell: bash
        run: |
          npx --no-install prettier src/components/InvoiceLifecycleModal.jsx > /tmp/InvoiceLifecycleModal.jsx
          diff -u src/components/InvoiceLifecycleModal.jsx /tmp/InvoiceLifecycleModal.jsx || true
