name: Temporary ledger formatting diff
on:
  push:
    branches:
      - fix/credit-installments-ledger-periods
permissions:
  contents: read
jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print Prettier diff without writes
        shell: bash
        run: |
          npx --no-install prettier src/components/TransactionList.jsx > /tmp/transaction-list-prettier.jsx
          diff -u src/components/TransactionList.jsx /tmp/transaction-list-prettier.jsx || true
