name: Temporary legacy PWA formatting diagnostic

on:
  push:
    branches:
      - fix/gate-2-2-reversal-concurrency

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print precise Prettier changes
        shell: bash
        run: |
          npx --no-install prettier pwa-e2e/legacy-upgrade.spec.js > /tmp/legacy-pwa-prettier.js
          diff -u pwa-e2e/legacy-upgrade.spec.js /tmp/legacy-pwa-prettier.js || true
