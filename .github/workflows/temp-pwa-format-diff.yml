name: Temporary PWA test formatting diff

on:
  push:
    branches:
      - fix/gate-2-2-reversal-concurrency

permissions:
  contents: read

jobs:
  show-format:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact PWA formatting differences
        shell: bash
        run: |
          npx --no-install prettier pwa-e2e/pwa.spec.js > /tmp/pwa-formatted.js
          diff -u pwa-e2e/pwa.spec.js /tmp/pwa-formatted.js || true
