name: Temporary savings formatting diagnostic

on:
  push:
    branches:
      - feat/savings-history-attachments

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier changes
        shell: bash
        run: |
          for file in src/components/Savings.jsx src/components/TransactionAttachmentManager.jsx src/components/TransactionAttachmentManager.test.jsx src/domain/savingsHistory.js src/domain/savingsHistory.test.js; do
            npx --no-install prettier "$file" > /tmp/meu-real-format.js
            diff -u "$file" /tmp/meu-real-format.js || true
          done
