name: Refresh approved cards screenshots
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/phase-60-card-invoice-history-discovery'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Install desktop and mobile Chromium
        run: npx playwright install --with-deps chromium
      - name: Regenerate only cards visual screenshots
        run: npm run test:visual:update -- --grep 'cards mantém baseline visual'
      - name: Commit only approved cards snapshot changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/visual/visual.spec.js-snapshots/cards-visual-desktop-chromium-linux.png e2e/visual/visual.spec.js-snapshots/cards-visual-mobile-chromium-linux.png
          if ! git diff --cached --quiet; then
            git commit -m 'test(visual): approve historical totals in cards screenshots'
            git push origin HEAD:refs/heads/fix/phase-60-card-invoice-history-discovery
          fi
