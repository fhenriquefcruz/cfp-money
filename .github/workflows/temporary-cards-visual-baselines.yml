name: Temporary refresh cards visual baselines
on:
  push:
    branches:
      - feat/phase-66-4-in-app-financial-audit
permissions:
  contents: write
jobs:
  refresh-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_E2E_MODE: 'true'
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: '1:123456789:web:test'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase-66-4-in-app-financial-audit
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Update only cards desktop and mobile snapshots
        run: npx playwright test --config=playwright.visual.config.js --grep "cards mantém baseline visual" --update-snapshots
      - name: Commit intentionally updated cards baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/visual.spec.js-snapshots/cards*
          if git diff --cached --quiet; then
            echo "No cards baseline changes"
          else
            git commit -m "test(visual): update cards baselines after Phase 66.4 interface changes"
            git push origin HEAD:feat/phase-66-4-in-app-financial-audit
          fi
