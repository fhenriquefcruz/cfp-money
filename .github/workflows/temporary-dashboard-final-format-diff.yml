name: Temporary dashboard remaining formatting diff
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write e2e/dashboard-bento.spec.js e2e/visual/visual.spec.js src/domain/categoryReview.test.js
      - run: git --no-pager diff -- e2e/dashboard-bento.spec.js e2e/visual/visual.spec.js src/domain/categoryReview.test.js
