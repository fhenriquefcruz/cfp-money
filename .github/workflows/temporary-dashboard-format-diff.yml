name: Temporary dashboard readonly formatting diff
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compute formatting in runner only
        run: npx prettier --write src/components/Dashboard.jsx src/components/Sidebar.jsx src/components/CategoryCompositionVisual.jsx src/components/PaymentControlCard.jsx src/components/dashboard-bento.css src/components/dashboard/BentoCategoryIcon.jsx src/domain/categoryReview.js src/domain/dashboardBento.js src/domain/dashboardBento.test.js
      - name: Show suggested formatting diff
        run: git --no-pager diff -- src/components/Dashboard.jsx src/components/Sidebar.jsx src/components/CategoryCompositionVisual.jsx src/components/PaymentControlCard.jsx src/components/dashboard-bento.css src/components/dashboard/BentoCategoryIcon.jsx src/domain/categoryReview.js src/domain/dashboardBento.js src/domain/dashboardBento.test.js
