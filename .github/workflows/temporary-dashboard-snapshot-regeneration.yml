name: Temporary dashboard snapshot regeneration
on:
  push:
    branches:
      - feat/dashboard-asymmetric-bento-dark
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/feat/dashboard-asymmetric-bento-dark'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/dashboard-asymmetric-bento-dark
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regenerate all route screenshots after design review
        run: npx playwright test --config=playwright.visual.config.js --update-snapshots
      - name: Commit only visual baseline PNGs to feature branch
        run: |
          git add e2e/visual/visual.spec.js-snapshots
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'test(visual): refresh approved route baselines for Bento dashboard'
            git push origin HEAD:feat/dashboard-asymmetric-bento-dark
          fi
