name: Temporary Gate 2.2 isolated security and performance
on:
  pull_request:
    branches:
      - fix/gate-2-invoice-idempotency-rules
permissions:
  contents: read
jobs:
  emulator:
    if: github.event.pull_request.head.ref == 'fix/gate-2-2-reversal-concurrency'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:rules
      - run: npx vitest run src/domain/invoiceOperation.test.js src/domain/invoiceLifecycle.test.js
      - run: npm run lint
      - run: npm run format:check
      - run: npm run validate:performance
