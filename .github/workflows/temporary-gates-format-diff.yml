name: Temporary Gates 0-1 formatting diff
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  formatting:
    if: github.event.pull_request.head.ref == 'fix/financial-gates-0-1-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate Prettier output only inside runner
        run: npx prettier --write docs/FINANCIAL_SEMANTICS.md src/domain/financialCore.js src/domain/financialParity.test.js worker/email-notifications/src/index.js worker/email-notifications/test/domain.test.js
      - name: Display exact formatting diff
        run: git --no-pager diff -- docs/FINANCIAL_SEMANTICS.md src/domain/financialCore.js src/domain/financialParity.test.js worker/email-notifications/src/index.js worker/email-notifications/test/domain.test.js
