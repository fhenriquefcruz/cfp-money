name: Temporary invoice lifecycle formatting diff
on:
  pull_request:
    branches:
      - fix/gate-2-invoice-idempotency-rules
permissions:
  contents: read
jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/gate-2-2-reversal-concurrency'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prettier reference in runner only
        run: npx prettier --write src/domain/invoiceLifecycle.js
      - name: Display patch to apply
        run: git --no-pager diff -- src/domain/invoiceLifecycle.js
