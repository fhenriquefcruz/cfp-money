name: Temporary Phase 66.5 readonly Prettier diagnostic
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/phase-66-5-snapshot-evidence
permissions:
  contents: read
jobs:
  show-format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply Prettier only inside runner
        run: npx prettier --write scripts/card-snapshot-evidence.mjs docs/phase-66-5-card-export-audit.md
      - name: Show exact suggested formatting without committing
        run: git --no-pager diff -- scripts/card-snapshot-evidence.mjs docs/phase-66-5-card-export-audit.md
