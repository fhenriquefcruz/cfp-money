name: Temporary Phase 61 prettier
on:
  push:
    branches:
      - feat/phase-61-reconciliation-ui
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    if: github.repository == 'fhenriquefcruz/cfp-money'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx prettier --write src/components/CardReconciliationModal.jsx
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CardReconciliationModal.jsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(cards): format confirmation copy'
            git push origin HEAD:refs/heads/feat/phase-61-reconciliation-ui
          fi
