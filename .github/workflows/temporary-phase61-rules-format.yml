name: Temporary Phase 61 rules formatting
on:
  push:
    branches:
      - test/phase-61-4-firestore-reconciliation-rules
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'fhenriquefcruz/cfp-money'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx prettier --write tests/security/firestore.rules.test.js
      - run: git diff --check
      - name: Commit formatted test
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/security/firestore.rules.test.js
          if ! git diff --cached --quiet; then
            git commit -m 'style(security): format reconciliation emulator test'
            git push origin HEAD:refs/heads/test/phase-61-4-firestore-reconciliation-rules
          fi
