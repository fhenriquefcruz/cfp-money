name: Temporary Phase 62 Audit Formatting
on:
  push:
    branches:
      - feat/phase-62-1-credit-integrity-audit
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'fhenriquefcruz/cfp-money'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx prettier --write src/domain/creditCardIntegrity.js src/domain/creditCardIntegrity.test.js
      - run: git diff --check
      - name: Commit formatted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/domain/creditCardIntegrity.js src/domain/creditCardIntegrity.test.js
          if ! git diff --cached --quiet; then
            git commit -m 'style(cards): format integrity audit'
            git push origin HEAD:refs/heads/feat/phase-62-1-credit-integrity-audit
          fi
