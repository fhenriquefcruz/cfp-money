name: Temporary Phase 62 Prettier
on:
  push:
    branches:
      - fix/phase-62-canonical-ids-in-export
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'fhenriquefcruz/cfp-money'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx prettier --write src/services/sparkPrivacy.test.js
      - run: git diff --check
      - name: Commit formatted file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/sparkPrivacy.test.js
          if ! git diff --cached --quiet; then
            git commit -m 'style(privacy): format export ID regression tests'
            git push origin HEAD:refs/heads/fix/phase-62-canonical-ids-in-export
          fi
