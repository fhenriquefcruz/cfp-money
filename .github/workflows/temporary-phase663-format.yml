name: Temporary phase 66.3 formatting inspection
on:
  pull_request:
    branches: [main]
jobs:
  formatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff without changing the branch
        run: |
          npx prettier --write scripts/card-snapshot-comparison.mjs scripts/audit-credit-cards.mjs src/domain/cardSnapshotComparison.test.js src/domain/creditCardFinancialParityCli.test.js
          git --no-pager diff -- scripts/card-snapshot-comparison.mjs scripts/audit-credit-cards.mjs src/domain/cardSnapshotComparison.test.js src/domain/creditCardFinancialParityCli.test.js
