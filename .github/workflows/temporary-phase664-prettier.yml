name: Temporary Phase 66.4 Prettier inspection
on:
  pull_request:
    branches: [main]
jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier diff without committing changes
        run: |
          npx prettier --write src/components/CreditCardsDashboard.jsx src/components/CreditCardsSettingsCard.jsx
          git --no-pager diff -- src/components/CreditCardsDashboard.jsx src/components/CreditCardsSettingsCard.jsx
