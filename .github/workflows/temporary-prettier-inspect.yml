name: Temporary Prettier diff inspection
on:
  push:
    branches:
      - feat/phase-65-card-diagnostics-clean
    paths:
      - .github/workflows/temporary-prettier-inspect.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Print exact Prettier formatting diff without committing
        run: |
          npx prettier --write src/components/CreditCardsDashboard.jsx
          git --no-pager diff -- src/components/CreditCardsDashboard.jsx
