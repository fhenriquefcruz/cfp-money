name: Temporary receipt cleanup format
on:
  push:
    branches:
      - fix/phase-57-5-recoverable-receipt-cleanup
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'fhenriquefcruz/cfp-money'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-fund
      - run: npx prettier --write src/services/receiptCleanup.js
      - run: git diff --check
      - name: Commit formatted source only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/receiptCleanup.js
          if ! git diff --cached --quiet; then
            git commit -m 'style(receipts): format recovery service'
            git push origin HEAD:refs/heads/fix/phase-57-5-recoverable-receipt-cleanup
          fi
