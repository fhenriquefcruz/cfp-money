name: Accessibility and visual regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-quality:
    name: WCAG and visual baselines
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_E2E_MODE: 'true'
      VITE_FIREBASE_API_KEY: test-api-key
      VITE_FIREBASE_AUTH_DOMAIN: test-project.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: test-project
      VITE_FIREBASE_STORAGE_BUCKET: test-project.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789'
      VITE_FIREBASE_APP_ID: '1:123456789:web:test'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Accessibility audit
        run: npm run test:a11y

      - name: Visual regression
        id: visual
        continue-on-error: true
        run: npm run test:visual

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-report
          path: |
            playwright-a11y-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload visual report and baselines
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-report
          path: |
            playwright-visual-report
            test-results
            e2e/visual/**/*-snapshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Enforce visual result
        if: steps.visual.outcome == 'failure'
        run: exit 1
