<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Meu Real — Sem conexão</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #070b18;
        color: #f8fafc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100dvh;
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
        place-items: center;
        background:
          radial-gradient(circle at 10% 10%, rgba(79, 70, 229, 0.36), transparent 34%),
          radial-gradient(circle at 90% 85%, rgba(8, 145, 178, 0.24), transparent 32%), #070b18;
      }

      main {
        width: min(100%, 420px);
        padding: 32px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 28px;
        background: rgba(15, 23, 42, 0.78);
        box-shadow: 0 32px 90px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(24px);
      }

      .mark {
        display: grid;
        width: 52px;
        height: 52px;
        margin-bottom: 24px;
        border-radius: 18px;
        place-items: center;
        background: linear-gradient(135deg, #6366f1, #0891b2);
        font-size: 24px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 8vw, 2.4rem);
        letter-spacing: -0.045em;
      }

      p {
        margin: 12px 0 24px;
        color: #cbd5e1;
        line-height: 1.65;
      }

      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 15px;
        background: #6366f1;
        color: white;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      small {
        display: block;
        margin-top: 18px;
        color: #94a3b8;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↗</div>
      <h1>Você está sem conexão</h1>
      <p>
        O Meu Real protege seus dados financeiros e precisa de internet para sincronizar suas
        informações. Assim que a conexão voltar, tente novamente.
      </p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
      <small>Nenhum dado financeiro foi armazenado nesta página offline.</small>
    </main>
  </body>
</html>
